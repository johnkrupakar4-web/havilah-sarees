name: Deploy Havilah Sarees

on:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Build website
    run: npm run build

  - name: Verify dist
    run: |
      echo "===== DIST CONTENTS ====="
      find dist -maxdepth 2 -type f | sort
      echo "===== DIST INDEX ====="
      head -30 dist/index.html

  - name: Upload Pages artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: dist

deploy:
needs: build
runs-on: ubuntu-latest

permissions:
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
