<main id="main">
  <!-- ===================== PAGE HEADER ===================== -->
  <section class="page-header">
    <div class="container">
      <span class="eyebrow" style="justify-content:center">Gallery</span>
      <h1 class="section-title">A Glimpse of the Weave</h1>
      <p class="section-lead" style="max-width:56ch">
        Woven textures, warm colours and quiet details — a look at the
        handloom sarees we love. Click any image to view it full size.
      </p>
    </div>
  </section>

  <!-- ===================== GALLERY GRID ===================== -->
  <section class="section" style="padding-top: 3rem">
    <div class="container">
      <div class="gallery-grid">
        {{GALLERY_ITEMS}}
      </div>
      <div class="cta-band__actions" style="justify-content:center; margin-top: 3rem">
        <a class="btn btn--whatsapp" href="#" data-wa="collection">Ask About Any Piece</a>
      </div>
    </div>
  </section>

  <!-- ===================== LIGHTBOX ===================== -->
  <div class="lightbox" data-lightbox-dialog role="dialog" aria-modal="true" aria-hidden="true" aria-label="Image viewer">
    <button class="lightbox__btn lightbox__close" data-lightbox-close type="button" aria-label="Close image viewer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
    <button class="lightbox__btn lightbox__prev" data-lightbox-prev type="button" aria-label="Previous image">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img class="lightbox__img" data-lightbox-img src="" alt="">
    <button class="lightbox__btn lightbox__next" data-lightbox-next type="button" aria-label="Next image">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <p class="lightbox__caption" data-lightbox-caption></p>
  </div>
</main>
